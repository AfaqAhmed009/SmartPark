<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard · Smart Car Parking System</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="page">
  <div class="container">

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
        </div>
        <div>
          <h1>Admin Dashboard</h1>
          <p class="subtitle">Manage parking slots, bookings, and users</p>
        </div>
      </div>
      <button class="btn btn-outline" id="signOutBtn">
        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </button>
    </header>

    <!-- Stats Grid -->
    <section class="stats-grid" id="statsGrid"></section>

    <!-- Tabs Panel -->
    <section class="panel">
      <div class="tabs-bar">
        <div class="tabs-scroll" id="tabsBar"></div>
      </div>
      <div class="tab-content" id="tabContent"></div>
    </section>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
